[project]
name = "reram-smu"
version = "0.1.0"
description = "ReRAM-SMU V1 — precision SMU engineering workspace (tooling only, Phase 0)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pandas==3.0.5",
    "matplotlib==3.11.1",
    "sympy==1.14.0",
    "pint==0.25.3",
    "uncertainties==3.2.3",
    "pyvisa==1.16.2",
    "pyvisa-py==0.8.1",
    "pyserial==3.5",
    "pytest==9.1.1",
    "jupyter==1.1.1",
    "ipykernel==7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["simulation/python/tests", "software/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py311"
